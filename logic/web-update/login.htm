<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><style>*{box-sizing:border-box}body{background:#f3f5f7;color:#182b39;font:16px/1.6 system-ui,sans-serif}main{max-width:420px;background:white;padding:24px;margin:8vh auto;border-radius:12px}label{display:block;margin:16px 0}input{display:block;width:100%;padding:10px;font:inherit;border:1px solid #9caebc;border-radius:5px}button{padding:10px 18px;background:#12689f;color:white;border:0;border-radius:6px;font:inherit}select{float:right;padding:6px}#login-status{color:#9b2915}</style><script src="js/app.js" defer></script></head><body><main><select id="login-language" aria-label="Language / 语言"><option value="en">English</option><option value="zh">中文</option></select><h1 id="login-title">Sign in</h1><p id="login-status" role="status"></p><form id="ap-login"><label><span id="login-user-label">Username</span><input id="login-user" autocomplete="username" maxlength="30" required></label><label><span id="login-pass-label">Password</span><input id="login-password" type="password" autocomplete="current-password" maxlength="30" required></label><button id="login-submit" type="submit">Sign in</button></form></main></body></html>
