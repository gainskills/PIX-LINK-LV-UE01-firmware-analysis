<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi management</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182b39;font:15px/1.6 system-ui,sans-serif}main{max-width:780px;margin:32px auto;padding:24px;background:white;border-radius:12px}a{color:#1769a5}h1{font-size:25px;margin:12px 0}p{margin:8px 0;color:#536674}fieldset{border:1px solid #d8e0e6;border-radius:8px;margin:20px 0;padding:16px}legend{font-weight:650;padding:0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0}input[type=checkbox]{width:20px;height:20px;flex:none}input[type=text],input[type=number],input[type=password],select{width:190px;max-width:100%;padding:8px;border:1px solid #9caebc;border-radius:5px;font:inherit}input:disabled{background:#eef1f4}button{padding:10px 18px;border:0;border-radius:6px;background:#12689f;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e9eff3;color:#26495f}#status{padding:12px;border-radius:6px;background:#eef5fa;overflow-wrap:anywhere}#status[data-error=true]{background:#fff0ec;color:#9b2915}.actions{display:flex;gap:12px;flex-wrap:wrap}small{display:block;color:#607480;overflow-wrap:anywhere}#current-link{overflow-wrap:anywhere}summary{cursor:pointer;font-weight:650}details{margin-top:16px}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}.row{align-items:flex-start}h1{font-size:23px}}
select{width:auto;float:right}label span{min-width:0}input[type=file]{max-width:100%}nav{display:flex;gap:16px;flex-wrap:wrap}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}dd{margin:0;overflow-wrap:anywhere}select{max-width:190px}label select{float:none}#networks:empty{display:none}#networks button{display:block;margin:6px 0}section{scroll-margin-top:16px}#radio-settings,#shared-radio,#uplink-settings{border:1px solid #d8e0e6;border-radius:8px;padding:12px}summary{margin-bottom:8px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.header-actions select{float:none}.header-actions button{background:white;border:1px solid #9caebc;color:#26495f;padding:8px 12px;white-space:nowrap}nav{margin:12px 0 20px}@media(max-width:600px){header{gap:4px}header h1{width:100%;margin-bottom:4px}.header-actions{width:100%;justify-content:flex-end}nav{gap:12px;font-size:14px}}.row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,440px)}.row input:not([type=checkbox]),.row select,.row textarea{width:100%;max-width:none;min-width:0;margin:0;float:none}.row.toggle{grid-template-columns:1fr 20px}.row textarea{padding:8px;border:1px solid #9caebc;border-radius:5px;font:inherit;resize:none;overflow:hidden;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.row[hidden]{display:none}#tools .row{margin:16px 0}#tools input[type=file]{display:block;margin:8px 0 16px;line-height:1.5}@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr);gap:5px}.row.toggle{grid-template-columns:1fr 20px}} </style><script src="js/app.js" defer></script></head><body><main><header><h1 data-t="title"></h1><div class="header-actions"><select id="language" aria-label="Language / 语言"><option value="en">English</option><option value="zh">中文</option></select><button id="reboot-device" type="button" disabled data-t="reboot"></button><button type="button" id="sign-out" class="secondary" data-t="signOut"></button></div></header><nav><a href="#wireless-state" data-t="overview"></a><a href="#controls" data-t="wireless"></a><a href="#network" data-t="management"></a><a href="#system" data-t="system"></a></nav><div id="status" role="status" aria-live="polite">…</div><section id="wireless-state"><h2 data-t="wirelessStatus"></h2><dl><dt data-t="mode"></dt><dd id="stat-mode">…</dd><dt data-t="uplinkStatus"></dt><dd id="stat-uplink">…</dd><dt data-t="clients"></dt><dd id="stat-clients">…</dd><dt data-t="firmwareVersion"></dt><dd id="stat-version">…</dd><dt data-t="uptime"></dt><dd id="stat-uptime">…</dd><dt data-t="deviceMac"></dt><dd id="stat-mac">…</dd></dl><small id="telemetry-note" role="status"></small><small data-t="clientsNote"></small><button type="button" id="refresh-status" class="secondary" data-t="refreshStatus"></button></section><form id="ap-settings"><fieldset disabled id="controls"><legend data-t="wireless"></legend><label class="row"><span data-t="mode"></span><select id="operation-mode"><option value="1" data-t="repeater"></option><option value="0">AP</option></select></label><label class="row toggle"><span data-t="dhcp"></span><input id="dhcp" type="checkbox"></label><small id="dhcp-note"></small><details id="shared-radio" open><summary data-t="sharedRadio"></summary><small data-t="sharedRadioNote"></small><label class="row"><span data-t="power"></span><input id="tx-power" type="number" min="1" max="100"></label><small data-t="powerNote"></small><label class="row"><span data-t="bandwidth"></span><select id="bandwidth"><option value="0">20 MHz</option><option value="1">20/40 MHz</option></select></label><small data-t="bandwidthNote"></small><p><span data-t="currentChannel"></span>: <span id="stat-channel">…</span></p><label class="row" id="channel-row"><span data-t="channel"></span><select id="channel"></select></label><small id="channel-note"></small></details><details id="radio-settings" open><summary data-t="radioSettings"></summary><label class="row"><span data-t="extSsid"></span><textarea id="ext-ssid" rows="1" maxlength="32" autocomplete="off" wrap="soft"></textarea></label><button type="button" id="ssid-default" class="secondary" disabled data-t="useDefault"></button><small id="ssid-note"></small><label class="row toggle"><span data-t="hide"></span><input id="hide-ssid" type="checkbox"></label><small data-t="hideNote"></small><label class="row toggle"><span data-t="wps"></span><input id="wps" type="checkbox"></label><label class="row"><span data-t="securityType"></span><select id="wifi-security"><option value="keep" data-t="keepSecurity"></option><option value="OPEN" data-t="openNetwork"></option><option value="WEP">WEP</option><option value="WPAPSK">WPA-PSK</option><option value="WPA2PSK">WPA2-PSK</option><option value="WPAPSKWPA2PSK">WPA/WPA2-PSK</option></select></label><label class="row" id="wifi-cipher-row"><span data-t="encryption"></span><select id="wifi-encryption"><option value="AES">AES</option><option value="TKIP">TKIP</option><option value="TKIPAES">TKIP/AES</option></select></label><label class="row"><span data-t="wifiPassword"></span><input id="wifi-password" type="password" autocomplete="new-password"></label><small data-t="passwordNote"></small></details><details id="uplink-settings" open><summary data-t="uplinkSettings"></summary><p><span data-t="connection"></span>: <span id="uplink-state">…</span></p><label class="row"><span data-t="upstreamSsid"></span><textarea id="upstream-ssid" rows="1" maxlength="32" autocomplete="off" wrap="soft"></textarea></label><button type="button" id="scan-networks" class="secondary" data-t="scan"></button><div id="networks"></div><small data-t="scanNote"></small><label class="row"><span data-t="securityType"></span><select id="upstream-security"><option value="keep" data-t="keepSecurity"></option><option value="OPEN" data-t="openNetwork"></option><option value="WEP">WEP</option><option value="WPAPSK">WPA-PSK</option><option value="WPA2PSK">WPA2-PSK</option><option value="WPAPSKWPA2PSK">WPA/WPA2-PSK</option></select></label><label class="row" id="upstream-cipher-row"><span data-t="encryption"></span><select id="upstream-encryption"><option value="AES">AES</option><option value="TKIP">TKIP</option><option value="TKIPAES">TKIP/AES</option></select></label><label class="row"><span data-t="upstreamPassword"></span><input id="upstream-password" type="password" autocomplete="new-password"></label><small data-t="upstreamPasswordNote"></small><button type="button" id="connect-upstream" data-t="connectUpstream"></button><small data-t="connectNote"></small></details></fieldset><fieldset disabled id="network"><legend data-t="management"></legend><small data-t="managementNote"></small><p><span data-t="current"></span>: <a id="current-link"></a></p><small data-t="bookmark"></small><label class="row toggle"><span data-t="static"></span><input id="independent" type="checkbox" aria-describedby="static-note"></label><small id="static-note" data-t="staticNote"></small><label class="row"><span data-t="address"></span><input id="lan-address" placeholder="192.168.10.1" type="text" inputmode="decimal" autocomplete="off"></label><small id="static-state"></small><small data-t="upstreamNote"></small><label class="row"><span data-t="port"></span><input id="port" type="number" min="1" max="65535" value="8080"></label></fieldset><p data-t="restartNote"></p><div class="actions"><button id="apply" type="submit" disabled data-t="apply"></button><button type="button" id="reload-settings" class="secondary" disabled data-t="reload"></button><button id="backup" type="button" class="secondary" disabled data-t="backup"></button></div></form><section id="system"><h2 data-t="system"></h2><fieldset disabled id="tools"><legend data-t="account"></legend><label class="row"><span data-t="username"></span><input id="account-user" type="text" maxlength="30" autocomplete="username"></label><label class="row"><span data-t="newPassword"></span><input id="account-password" type="password" maxlength="30" autocomplete="new-password"></label><label class="row"><span data-t="confirmPassword"></span><input id="account-confirm" type="password" maxlength="30" autocomplete="new-password"></label><button id="save-account" type="button" data-t="saveAccount"></button><hr><label data-t="restoreLabel" for="restore-file"></label><input id="restore-file" type="file" accept=".bin,.txt"><p data-t="restoreNote"></p><button id="restore-settings" type="button" data-t="restore"></button><hr><label data-t="upgradeLabel" for="upgrade-file"></label><input id="upgrade-file" type="file" accept=".bin"><p data-t="upgradeNote"></p><label class="row toggle"><span data-t="upgradeConfirm"></span><input id="upgrade-confirm" type="checkbox"></label><button id="upgrade-firmware" type="button" data-t="upgrade"></button></fieldset></section></main></body></html>
